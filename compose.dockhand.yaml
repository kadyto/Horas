# Puede pegarse en un stack de Dockhand sin clonar el repositorio.
services:
  horas:
    build:
      context: https://github.com/kadyto/Horas/archive/refs/heads/main.tar.gz
      dockerfile: Horas-main/Dockerfile
      args:
        SOURCE_DIR: Horas-main
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8092}:8000"
    environment:
      DATA_DIR: /data
      APP_PASSWORD: ${APP_PASSWORD:?Define una contraseña propia de al menos 12 caracteres}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - horas_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  horas_data:
