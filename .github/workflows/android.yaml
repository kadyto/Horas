name: Android sin servidor
on:
  push:
    branches: [main]
    paths: ['android/**', 'app/static/**', 'tests/fixtures/**', '.github/workflows/android.yaml']
  pull_request:
    paths: ['android/**', 'app/static/**', 'tests/fixtures/**', '.github/workflows/android.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y probar los cálculos
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Permitir el uso de KVM en el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar SQLite y WebView sin Internet ni contraseña
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.horas.local.test/app.horas.local.OfflineTests | tee /tmp/horas-android-tests.txt
            grep -q 'horasTests=ok' /tmp/horas-android-tests.txt
            adb uninstall app.horas.local
            adb install android/releases/Horas-1.0.0.apk
            adb shell am start -n app.horas.local/.MainActivity
            sleep 2
            adb shell am force-stop app.horas.local
            adb install -r android/releases/Horas-1.1.0.apk
            adb shell am start -n app.horas.local/.MainActivity
            sleep 2
            adb shell pidof app.horas.local
            adb exec-out screencap -p > android/android-emulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-api-${{ matrix.api }}
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/app-debug.apk
            android/android-emulator.png
